db_path: db/cloud_knowledge.db
db_copy_to: ~/Library/Mobile Documents/com~apple~CloudDocs/chiebukuro-mcp/db/cloud_knowledge.db

allowed_write_host: bashs-MacBook-Pro

esa:
  team: bash-trunk-changes
  wip: false
  sources:
    aws_blog:    { category: production/cloud-trunk-changes/aws }
    gcp_blog:    { category: production/cloud-trunk-changes/gcp }
    gws_blog:    { category: production/cloud-trunk-changes/gws }

models:
  classifier:       { provider: claude,       model: haiku }
  daily_summarizer: { provider: local_llama, model: "qwen3.6-35b-a3b-iq2m" }
  default:          { provider: claude,       model: sonnet }
